name: Browser Wheel

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-browser-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Build browser wheel
        run: |
          python3 scripts/build_browser_wheel.py --out-dir dist/browser-wheels
          cp dist/browser-wheels/codeflow_py-*.whl dist/browser-wheels/codeflow_py-browser.whl
      - name: Upload browser wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeflow-py-browser-wheel
          path: dist/browser-wheels/codeflow_py-browser.whl
      - name: Publish browser wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/browser-wheels/codeflow_py-browser.whl
